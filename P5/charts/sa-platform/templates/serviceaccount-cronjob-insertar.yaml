apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.nombreCronInsertar" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
---
# RBAC de minimo privilegio: este Job no llama a la API de Kubernetes
# (solo se conecta a Postgres), pero la practica exige un ServiceAccount
# dedicado con Role/RoleBinding propios y nunca el ServiceAccount default.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.nombreCronInsertar" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aroma-db-init"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.nombreCronInsertar" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sa-platform.nombreCronInsertar" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.nombreCronInsertar" . }}
    namespace: {{ .Release.Namespace }}
