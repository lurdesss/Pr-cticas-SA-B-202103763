# Scripts que bitnami/postgresql ejecuta UNA sola vez, la primera vez que
# arranca con un volumen de datos vacio (ver postgresql.primary.initdb en
# values.yaml). Si el PVC ya tiene datos, esto no vuelve a correr: para
# forzarlo hay que borrar el PVC (ver docs/comandos-reproducibles.md).
#
# Nombre FIJO (no depende de {{ .Release.Name }}) para que
# postgresql.primary.initdb.scriptsConfigMap en values.yaml pueda
# referenciarlo como una cadena literal: los archivos de values NO pasan
# por el motor de plantillas de Helm, asi que no pueden calcular un
# nombre dinamico.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aroma-db-init
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
data:
  00-databases.sql: |
    -- catalogo_db la crea bitnami con postgresql.auth.database; el resto
    -- las crea este script. CREATE DATABASE no admite IF NOT EXISTS, asi
    -- que se envuelve en un bloque que ignora el error si ya existe (por
    -- si un "helm upgrade" reejecutara el init de un volumen ya usado).
    SELECT 'CREATE DATABASE inventario_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'inventario_db')\gexec

    SELECT 'CREATE DATABASE pedidos_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'pedidos_db')\gexec

    SELECT 'CREATE DATABASE resenas_db'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'resenas_db')\gexec

  01-pedidos-tablas-cron.sql: |
    -- \c cambia de base de datos DENTRO del mismo script de psql. Estas
    -- tablas tambien las crea pedidos-service al arrancar
    -- (CREATE TABLE IF NOT EXISTS), pero se dejan aqui ademas para que el
    -- Cronjob 1 no dependa de que pedidos-service haya arrancado primero.
    \c pedidos_db

    CREATE TABLE IF NOT EXISTS ejecuciones_cron (
      id           SERIAL PRIMARY KEY,
      carne        TEXT NOT NULL,
      ejecutado_en TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS resumenes_cron (
      id                SERIAL PRIMARY KEY,
      hora              TIMESTAMPTZ NOT NULL,
      total_ejecuciones INTEGER NOT NULL,
      generado_en       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      procesado_en      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS notificaciones_pedidos (
      id           SERIAL PRIMARY KEY,
      pedido_id    INTEGER NOT NULL,
      mensaje      TEXT NOT NULL,
      procesado_en TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
