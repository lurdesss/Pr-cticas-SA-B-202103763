# Practica 6: pedidos (productor y worker consumidor), el Cronjob 2 (que
# publica el resumen), y ahora TAMBIEN el gateway (que publica auditoria
# de cada peticion, ver services/gateway/src/broker.js) pueden hablarle
# al broker. catalogo, inventario y resenas no lo necesitan y por eso no
# aparecen aqui.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-servicios-a-rabbitmq
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pedidos
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "sa-platform.nombreCronResumen" . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - protocol: TCP
          port: 5672
