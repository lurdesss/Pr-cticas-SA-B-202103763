apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.nombreCronResumen" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
# Practica 6 (DigitalOcean): esta imagen SI es privada (viene de DOCR,
# no de un registro publico como postgres:16-alpine), asi que necesita
# el mismo imagePullSecrets que los subcharts de microservicios.
{{- if .Values.global.imagePullSecretName }}
imagePullSecrets:
  - name: {{ .Values.global.imagePullSecretName }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.nombreCronResumen" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aroma-db-init"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.nombreCronResumen" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sa-platform.nombreCronResumen" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.nombreCronResumen" . }}
    namespace: {{ .Release.Namespace }}
