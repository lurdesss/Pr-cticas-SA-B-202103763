apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.nombreCronResumen" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-platform.nombreCronResumen" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["aroma-db-init"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sa-platform.nombreCronResumen" . }}
  labels: {{ include "sa-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sa-platform.nombreCronResumen" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sa-platform.nombreCronResumen" . }}
    namespace: {{ .Release.Namespace }}
