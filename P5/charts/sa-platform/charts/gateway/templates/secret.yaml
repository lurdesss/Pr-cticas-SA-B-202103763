# Practica 6: el gateway ahora publica auditoria en RabbitMQ (ver
# services/gateway/src/broker.js), asi que necesita las credenciales del
# broker. Van en un Secret, nunca en el ConfigMap: la contrasena de
# RabbitMQ no debe quedar visible en texto plano con un simple
# "kubectl get configmap -o yaml".
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels: {{ include "sa-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  BROKER_URL: "amqp://{{ required "Falta global.broker.username" .Values.global.broker.username }}:{{ required "Falta global.broker.password" .Values.global.broker.password }}@{{ .Values.global.broker.host }}:{{ .Values.global.broker.port }}"
