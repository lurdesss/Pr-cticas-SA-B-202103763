{{- if .Values.ingress.habilitado }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels: {{ include "sa-common.labels" . | nindent 4 }}
  annotations:
    # Anotacion propia de nginx-ingress: el controlador de GKE simplemente
    # la ignora, asi que dejarla no rompe nada en la nube.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: {{ .Values.ingress.claseDeIngress }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sa-common.fullname" . }}
                port:
                  number: {{ (.Values.servicio | default dict).puerto | default 8000 }}
      {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
{{- end }}
