apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels: {{ include "sa-common.labels" . | nindent 4 }}
data:
  PUERTO: {{ .Values.servicio.puerto | quote }}
  NIVEL_LOG: {{ .Values.registro.nivel | default "info" | quote }}
  CATALOGO_SERVICE_URL: "http://{{ .Release.Name }}-catalogo:4001"
  INVENTARIO_SERVICE_URL: "http://{{ .Release.Name }}-inventario:4002"
  PEDIDOS_SERVICE_URL: "http://{{ .Release.Name }}-pedidos:4003"
  RESENAS_SERVICE_URL: "http://{{ .Release.Name }}-resenas:4004"
