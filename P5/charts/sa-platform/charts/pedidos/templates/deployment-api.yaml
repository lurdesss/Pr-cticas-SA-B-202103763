# Productor: crea el pedido en pedidos_db y PUBLICA el evento en RabbitMQ
# sin esperar a que nadie lo consuma (ver services/pedidos-service/src/broker.js).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sa-common.fullname" . }}-api
  labels: {{ include "sa-common.labels" . | nindent 4 }}
    sa-platform/rol: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{ include "sa-common.selectorLabels" . | nindent 6 }}
      sa-platform/rol: api
  template:
    metadata:
      labels:
        {{ include "sa-common.labels" . | nindent 8 }}
        sa-platform/rol: api
      annotations:
        {{ include "sa-common.checksumConfigAnnotation" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sa-common.fullname" . }}
      securityContext: {{ include "sa-common.podSecurityContext" . | nindent 8 }}
      containers:
        - name: pedidos-api
          image: {{ include "sa-common.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "src/index.js"]
          securityContext: {{ include "sa-common.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.servicio.puerto }}
          envFrom:
            - configMapRef: { name: {{ include "sa-common.fullname" . }} }
            - secretRef: { name: {{ include "sa-common.fullname" . }} }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources: {{ .Values.api.recursos | toYaml | nindent 12 }}
          startupProbe:
            httpGet: { path: {{ .Values.api.sondas.arranque.rutaHttp }}, port: http }
            initialDelaySeconds: {{ .Values.api.sondas.arranque.delayInicialSeg }}
            periodSeconds: {{ .Values.api.sondas.arranque.periodoSeg }}
            failureThreshold: {{ .Values.api.sondas.arranque.fallosPermitidos }}
          livenessProbe:
            httpGet: { path: {{ .Values.api.sondas.vida.rutaHttp }}, port: http }
            periodSeconds: {{ .Values.api.sondas.vida.periodoSeg }}
            timeoutSeconds: {{ .Values.api.sondas.vida.timeoutSeg }}
            failureThreshold: {{ .Values.api.sondas.vida.fallosPermitidos }}
          readinessProbe:
            httpGet: { path: {{ .Values.api.sondas.disponible.rutaHttp }}, port: http }
            periodSeconds: {{ .Values.api.sondas.disponible.periodoSeg }}
            timeoutSeconds: {{ .Values.api.sondas.disponible.timeoutSeg }}
            failureThreshold: {{ .Values.api.sondas.disponible.fallosPermitidos }}
      volumes:
        - name: tmp
          emptyDir: {}
