apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels: {{ include "sa-common.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames: ["{{ include \"sa-common.fullname\" . }}"]
    verbs: ["get", "list", "watch"]
