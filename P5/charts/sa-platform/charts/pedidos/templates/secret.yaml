apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels: {{ include "sa-common.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "{{ .Values.db.esquemaUrl }}://{{ required "Falta global.db.username" .Values.global.db.username }}:{{ required "Falta global.db.password" .Values.global.db.password }}@{{ .Values.global.db.host }}:{{ .Values.global.db.port }}/{{ .Values.db.nombre }}"
  # BROKER_URL lleva la contrasena de RabbitMQ: vive en el Secret, no en
  # el ConfigMap (que es texto plano, visible con "kubectl get configmap -o yaml"
  # sin ningun permiso adicional). Corregido en la Practica 6, donde
  # "gestionar las credenciales mediante Secrets" es un requisito explicito.
  BROKER_URL: "amqp://{{ required "Falta global.broker.username" .Values.global.broker.username }}:{{ required "Falta global.broker.password" .Values.global.broker.password }}@{{ .Values.global.broker.host }}:{{ .Values.global.broker.port }}"
