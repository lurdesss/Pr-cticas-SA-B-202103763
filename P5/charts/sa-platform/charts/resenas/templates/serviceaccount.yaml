apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-common.fullname" . }}
  labels: {{ include "sa-common.labels" . | nindent 4 }}
# Practica 6 (DigitalOcean): DOCR crea el Secret de credenciales al
# integrarse con el cluster ("doctl kubernetes cluster registry add"),
# pero solo lo agrega al ServiceAccount "default" de cada namespace. Como
# aqui cada subchart usa su PROPIO ServiceAccount (requisito de RBAC de
# minimo privilegio de la Practica 5), hay que referenciarlo aqui
# tambien. Sin valor definido (caso local / GKE), esto no renderiza nada.
{{- if .Values.global.imagePullSecretName }}
imagePullSecrets:
  - name: {{ .Values.global.imagePullSecretName }}
{{- end }}
