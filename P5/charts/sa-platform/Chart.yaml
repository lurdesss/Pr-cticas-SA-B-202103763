apiVersion: v2
name: sa-platform
description: >
  Plataforma Aroma completa (gateway, catalogo, inventario, pedidos,
  resenas) mas base de datos y broker de mensajeria, empaquetada como un
  unico chart de Helm instalable con un solo comando.
type: application

# Versionado real del chart (Practica 5, requisito A): se publican al
# menos dos versiones durante el desarrollo para poder demostrar
# "helm upgrade" y "helm rollback" con "helm history" como evidencia.
# Ver docs/comandos-reproducibles.md para la secuencia exacta.
version: 0.2.0
appVersion: "1.0.0"

dependencies:
  # Bitnami despliega PostgreSQL como StatefulSet con PersistentVolumeClaim
  # y un headless service ("<fullname>-hl"), que es exactamente el
  # requisito C (persistencia) sin tener que escribir el StatefulSet a mano.
  - name: postgresql
    version: ">=13.0.0 <17.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  # Bitnami despliega RabbitMQ tambien como StatefulSet con persistencia
  # propia (no es requisito que lo sea, pero viene incluido).
  - name: rabbitmq
    version: ">=12.0.0 <16.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled

  # Los cinco microservicios son subcharts locales del chart padre.
  # Declararlos aqui evita que helm lint marque que faltan dependencias
  # cuando el chart se evalua como un paquete completo.
  - name: gateway
    version: "0.1.0"
    repository: "file://charts/gateway"
  - name: catalogo
    version: "0.1.0"
    repository: "file://charts/catalogo"
  - name: inventario
    version: "0.1.0"
    repository: "file://charts/inventario"
  - name: pedidos
    version: "0.1.0"
    repository: "file://charts/pedidos"
  - name: resenas
    version: "0.1.0"
    repository: "file://charts/resenas"
  - name: sa-common
    version: "0.1.0"
    repository: "file://charts/sa-common"
