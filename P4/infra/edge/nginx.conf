# Unico punto de entrada publico del sistema.
# Sirve el frontend estatico y reenvia /api/ al API Gateway.
# Al vivir todo bajo el mismo origen (http://localhost:8080) el navegador
# envia la cookie de sesion sin necesidad de CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion basica para el frontend
    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
