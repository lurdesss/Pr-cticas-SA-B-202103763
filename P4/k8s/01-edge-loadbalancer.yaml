# Referencia de diseno: como saldria el frontend al exterior en Kubernetes
# usando un Service de tipo LoadBalancer. NO se usa con docker compose.
apiVersion: v1
kind: Service
metadata:
  name: aroma-edge
  labels:
    app: aroma
    componente: edge
spec:
  type: LoadBalancer
  selector:
    app: aroma
    componente: edge
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aroma-edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aroma
      componente: edge
  template:
    metadata:
      labels:
        app: aroma
        componente: edge
    spec:
      containers:
        - name: edge
          image: aroma/edge:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Los microservicios se declaran ClusterIP: alcanzables solo dentro del
# cluster. Ejemplo con el gateway; los demas siguen el mismo patron.
apiVersion: v1
kind: Service
metadata:
  name: aroma-gateway
spec:
  type: ClusterIP
  selector:
    app: aroma
    componente: gateway
  ports:
    - port: 8000
      targetPort: 8000
