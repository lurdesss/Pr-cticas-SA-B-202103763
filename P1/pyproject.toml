[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F: errores y estilo, I: orden de imports, N: nombres, B: bugs comunes,
# S: reglas de seguridad (bandit), D: docstrings.
select = ["E", "F", "I", "N", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert es válido dentro de las pruebas

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
