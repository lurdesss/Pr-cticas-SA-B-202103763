<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Módulo de autenticación</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Módulo de autenticación</h1>
    <p class="subtitulo">
      El token de sesión viaja en una cookie HTTP-only. Esta página nunca lo lee
      ni lo almacena.
    </p>

    <div class="pestanas" role="tablist">
      <button role="tab" aria-selected="true" data-panel="panel-login">Iniciar sesión</button>
      <button role="tab" aria-selected="false" data-panel="panel-registro">Crear cuenta</button>
    </div>

    <div id="mensaje"></div>

    <section class="tarjeta" id="panel-login">
      <h2>Iniciar sesión</h2>
      <label for="login-correo">Correo</label>
      <input type="email" id="login-correo" autocomplete="email" placeholder="admin@academia.test">

      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" autocomplete="current-password">

      <button class="principal" id="btn-login">Entrar</button>
    </section>

    <section class="tarjeta oculto" id="panel-registro">
      <h2>Crear cuenta</h2>
      <label for="reg-nombre">Nombre</label>
      <input type="text" id="reg-nombre" autocomplete="name">

      <label for="reg-correo">Correo</label>
      <input type="email" id="reg-correo" autocomplete="email">

      <label for="reg-password">Contraseña (mínimo 8 caracteres)</label>
      <input type="password" id="reg-password" autocomplete="new-password">

      <label for="reg-rol">Rol</label>
      <select id="reg-rol">
        <option value="cliente">Cliente</option>
        <option value="admin">Admin</option>
      </select>

      <button class="principal" id="btn-registro">Crear cuenta y entrar</button>
      <p class="nota">
        El nombre y el correo se guardan cifrados con AES-256-GCM. La contraseña
        se almacena como hash bcrypt y no puede recuperarse.
      </p>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="acceso.js"></script>
</body>
</html>
