# ============================================================================
# LA UNICA Application que se aplica A MANO en todo el bootstrap.
#
# Orden completo del dia cero:
#   1. terraform apply   (P9/terraform)  -> crea el cluster + instala ArgoCD
#   2. kubectl apply -f P9/argocd/root-application.yaml   <- este archivo,
#      UNA sola vez, justo despues del paso 1
#   3. A partir de aqui, TODO lo demas lo hace ArgoCD solo: descubre cada
#      .yaml dentro de la carpeta apps/ del repositorio aroma-gitops y
#      los sincroniza como Applications hijas (Argo Rollouts, Kyverno,
#      Sealed Secrets, Velero, y despues los charts de cada microservicio).
#
# No se ejecuta ningun kubectl apply, kubectl set image ni helm upgrade
# contra el cluster desde ningun workflow de GitHub Actions -- ese es
# precisamente el requisito "Prohibicion de despliegue directo" del
# enunciado. Este archivo es la UNICA excepcion, y es manual a proposito:
# es el bootstrap, no un despliegue continuo.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aroma-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/lurdesss/aroma-gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
